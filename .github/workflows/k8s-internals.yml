name: 'K8S Internals'

#on:
#  workflow_run:
#    workflows: ['Terraform TST', 'Terraform ACC', 'Terraform PRD']
#    types: [completed]

on:
  workflow_dispatch:

jobs:
  k8s-internals:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
#    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Fetch AKS kubeconfig
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            {
            echo 'KUBE_CONFIG<<EOF'
            az aks get-credentials --resource-group rg-cicd-apps --name cicdcluster --file -
            echo EOF
            } >> "$GITHUB_ENV"
            cat 
