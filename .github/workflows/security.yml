name: 'Security'

on:
  pull_request:
    types: [opened, reopened]
  merge_group:

jobs:
  call-terraform-security:
    if: github.event_name == 'merge_group' # only run job if workflow initiated by a merge group event
    uses: corbencreatives/action-workflows/.github/workflows/terraform-security.yml@v0.5.2
    with:
      terraform-path: "./terraform"
    permissions:
      contents: read
      security-events: write
