name: 'Security'

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

jobs:
  call-terraform-security:
    if: github.event_name == 'pull_request' # only run job if workflow initiated by a pull request event
    uses: corbencreatives/action-workflows/.github/workflows/terraform-security.yml@v0.5.1
    with:
      terraform-path: "./terraform"
    permissions:
      contents: read
      security-events: write
