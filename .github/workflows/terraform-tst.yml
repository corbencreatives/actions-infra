name: 'Terraform TST'

on:
  pull_request:
    types: [closed]
    branches: [develop]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

env:
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

jobs:
  call-terraform-plan-apply:
    #    if: github.event_name == 'pull_request' # only run job if workflow initiated by a pull request event
    uses: corbencreatives/action-workflows/.github/workflows/terraform-plan-apply.yml@v0.5.9
    with:
     token: ${{env.TF_API_TOKEN}}
     environment: "test"
     tf-workspace: "action-workflows"
     config-directory: "./terraform"
    permissions:
      contents: read
      pull-requests: write
