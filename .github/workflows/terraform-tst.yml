name: 'Terraform TST'

on:
  pull_request:
    types: [closed]
    branches: [develop]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  call-terraform-plan-apply:
    #    if: github.event_name == 'pull_request' # only run job if workflow initiated by a pull request event
    uses: corbencreatives/action-workflows/.github/workflows/terraform-plan-apply.yml@v0.5.7
    with:
     environment: "test"
     tf-workspace: "corbencreatives"
     config-directory: "./terraform"
    permissions:
      contents: read
      pull-requests: write
